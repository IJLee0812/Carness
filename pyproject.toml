[project]
name = "carness"
version = "0.1.0"
description = "공개 CAN·DBC 데이터로 차량 도메인 지식을 실습하는 개인 학습 repo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cantools>=40",
    "opendbc>=0.3.1",
    "mcap>=1.2",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "markdown-it-py>=4.2.0",
]

[project.scripts]
carness-lab = "carness.lab.server:main"
carness-check = "carness.lab.exercises:cli"
carness-dbc = "carness.can.matrix:cli"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carness"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/carness/lab/runner.py" = ["S102", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
