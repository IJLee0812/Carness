summary = "디코딩한 신호로 급제동·차로 변경 같은 주행 이벤트 구간을 찾고, 영상으로 확인한다."
planned = ["규칙으로 이벤트 정의하기", "이벤트 구간 잘라내기", "영상으로 검출 결과 확인하기"]

[[modules]]
