title = "Carness"
subtitle = "Car Domain + Harness"
description = "CAN·DBC, 차량 Ethernet(ARXML·SOME/IP), 영상 정합, 로그 포맷과 컨테이너(BLF·MCAP·rosbag)까지. 차량 센서데이터를 받으면 무엇을 확인하고 어떻게 판단할지 스스로 아는 수준을 목표로, 공개 데이터로 한 단계씩 손과 코드로 쌓아 가는 차량 도메인 지식 하네스입니다."

[[modules]]
dir = "01-dbc"
title = "DBC 읽기"
summary = "CAN 메시지 사전인 DBC의 구조를 보고, 메시지·신호·비트 배치를 읽는다."

[[modules]]
dir = "02-hand-decoding"
title = "손으로 디코딩하기"
summary = "비트 번호, Intel·Motorola, 2의 보수, factor·offset을 격자 위에서 직접 계산하며 익힌다."

[[modules]]
dir = "03-python-decoder"
title = "코드로 디코더 만들기"
summary = "파이썬을 처음 쓰는 사람도 빈칸을 채우며 신호 디코더를 완성한다."

[[modules]]
dir = "04-real-log"
title = "실제 주행 로그 다루기"
summary = "cantools와 실제 로그로 시계열을 만들고, 값이 맞다는 근거와 체크섬까지 확인한다."

[[modules]]
dir = "05-video-sync"
title = "영상과 CAN 정합"
status = "soon"
summary = "전방 영상 프레임과 CAN 신호를 같은 시간축에 맞추고, 신호와 장면이 일치하는지 확인한다."
planned = ["영상 프레임 시각과 CAN 시간축", "hevc 영상에서 프레임 꺼내기", "신호와 장면이 맞는지 확인하기", "두 시간축의 오프셋 추정"]

[[modules]]
dir = "06-log-formats"
title = "로그 포맷과 컨테이너"
status = "soon"
summary = "Vector BLF·ASC 같은 측정 로그와 MCAP·rosbag 컨테이너를 읽고, raw CAN·신호·영상을 토픽으로 묶었다가 다시 꺼내 디코딩한다."
planned = ["Vector BLF·ASC 로그 읽기", "MCAP 구조: 채널·스키마·메시지", "rosbag(ROS 1·2)과 MCAP 비교", "raw CAN을 MCAP에 쓰고 다시 꺼내 디코딩하기", "Foxglove로 신호와 영상 함께 재생하기"]

[[modules]]
